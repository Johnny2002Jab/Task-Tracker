name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-tracker/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t task-tracker:ci .

      - name: Run container
        run: docker run -d --rm -p 8000:8000 --name tt-ci task-tracker:ci

      - name: Wait for /health to return 200
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy within 15s" >&2
          docker logs tt-ci
          exit 1

      - name: Verify container runs as non-root
        run: |
          user=$(docker exec tt-ci whoami)
          echo "container user: $user"
          test "$user" = "app"

      - name: Stop container
        if: always()
        continue-on-error: true
        run: docker stop tt-ci
